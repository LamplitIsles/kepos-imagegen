name: Publish npm packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: npm install --global npm@">=11.10.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:sync-version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm release:check
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - run: pnpm test:pack
      - uses: actions/upload-artifact@v4
        with:
          name: verified-public-packages
          path: |
            packages/dsh-imagegen/dist
            packages/dsh-imagegen/package.json
            packages/dsh-imagegen/cordis.patch.yml
            packages/dsh-imagegen/README.md
            packages/pi-imagegen/dist
            packages/pi-imagegen/package.json
            packages/pi-imagegen/README.md

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: [dsh-imagegen, pi-imagegen]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@">=11.10.0"
      - uses: actions/download-artifact@v4
        with:
          name: verified-public-packages
          path: packages
      - name: Publish verified package
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PACKAGE: ${{ matrix.package }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish "./packages/$PACKAGE" --no-git-checks --access public --provenance --tag beta
          else
            npm publish "./packages/$PACKAGE" --no-git-checks --access public --provenance --tag latest
          fi
